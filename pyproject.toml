[project]
name = "claude-code-dsgvo-hooks"
version = "0.1"
description = "Claude Code hooks that block personal data (DSGVO/GDPR) and risky tool calls before they reach the model"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "niclasedge"}]
license = "Apache-2.0"
classifiers = []
# The hooks themselves are stdlib-only. The NLP-based mock-data generator
# (.claude/tools/generate_mock_data.py) needs the optional "mock-data" extra.
dependencies = []

[project.optional-dependencies]
mock-data = [
    "gliner>=0.2.25",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "spacy>=3.8.11",
]

[dependency-groups]
dev = [
    "pytest"
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/niclasedge/claude-code-dsgvo-hooks"
Issues = "https://github.com/niclasedge/claude-code-dsgvo-hooks/issues"
